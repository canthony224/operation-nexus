# CI: lint, typecheck, build and test for the Python app and the overlay (NX-011), plus the
# security checks in security.yml (NX-012).
# Spec: docs/cicd/CICD-ARCHITECTURE.md §3-§5, ADR-0009.
#
# Gate policy (ADR-0009). `ci-gate` is the only check branch protection needs.
#   - Lint, format, typecheck, import contracts, build and security: always blocking.
#   - Tests (python-test, sim-determinism, overlay-test): advisory when the
#     target branch is `develop`, required when it is `main`. Advisory test
#     jobs still run and show red; ci-gate turns their failure into a warning
#     instead of failing.
#   - Skipped jobs (path filter) count as success.
#   - pr-hygiene (pr-hygiene.yml, NX-017) is blocking on every PR.
#     `edited` re-runs CI so a fixed PR title or body clears it.
#   - python-test also runs the repo-check script tests (scripts/tests), so
#     they follow the same advisory/required rule as the other tests.
#
# Security notes: no pull_request_target; top-level permissions are empty and
# each job gets contents: read only; checkout does not persist credentials;
# event data reaches shell steps only through env vars, never ${{ }} in run.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      overlay: ${{ steps.filter.outputs.overlay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On pull_request, HEAD is the merge commit and HEAD^1 is the base tip.
          fetch-depth: 2
      - name: Filter changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Pushes to develop/main always run the full suite (CICD §3).
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "overlay=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # File names are PR-controlled: match them, never echo them to the log
          # (a name like "::error::..." would be parsed as a workflow command).
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files: $(printf '%s\n' "$changed" | grep -c . || true)"
          shared='^(contracts/|Makefile$|\.node-version$|\.github/workflows/ci\.yml$)'
          if printf '%s\n' "$changed" | grep -Eq "^(services/|tools/|scripts/)|$shared"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "^apps/|$shared"; then
            echo "overlay=true" >> "$GITHUB_OUTPUT"
          else
            echo "overlay=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: python (lint, types)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          cache-dependency-glob: services/sim/uv.lock
      # Same commands as `make check-python`.
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen lint-imports

  python-test:
    name: python (tests)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          cache-dependency-glob: services/sim/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      # Repo-check script tests (scripts/, stdlib only), as in `make check-python`.
      - run: python3 scripts/tests/test_repo_checks.py
        working-directory: .
      # Discord setup tool tests (tools/discord-setup, stdlib only, fake HTTP layer, no network).
      - run: python3 tools/discord-setup/tests/test_setup.py
        working-directory: .

  # Golden replays in four interpreters with different PYTHONHASHSEED values,
  # compared with each other and with the committed hashes (NX-105, SIM-CORE
  # SC-3, TESTING-STRATEGY §3.2). A test job: advisory on develop (ADR-0009).
  sim-determinism:
    name: sim-determinism
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          cache-dependency-glob: services/sim/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen python ../../tools/sim-determinism/check.py

  overlay:
    name: overlay (types, lint, build)
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/overlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/overlay/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/overlay/pnpm-lock.yaml
      # Same scripts as `make check-overlay`, plus the production build.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  overlay-test:
    name: overlay (tests)
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/overlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/overlay/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/overlay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Generated contract types match contracts/ (NX-021, CONTRACTS §3.1) and the
  # compat report against the PR base (Q-CT-8, Q-CT-9). Blocking.
  contracts:
    name: contracts (drift, compat)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          cache-dependency-glob: services/sim/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/overlay/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/overlay/pnpm-lock.yaml
      - run: (cd services/sim && uv sync --frozen) && pnpm --dir apps/overlay install --frozen-lockfile
      - name: Regenerate and fail on drift
        run: |
          set -euo pipefail
          make contracts
          git diff --exit-code -- services/sim/src/nexus/contracts apps/overlay/src/contracts
          test -z "$(git status --porcelain -- services/sim/src/nexus/contracts apps/overlay/src/contracts)"
      - name: Compat report against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          mkdir -p /tmp/base
          git archive FETCH_HEAD contracts | tar -x -C /tmp/base
          python3 scripts/check_contracts_compat.py /tmp/base/contracts contracts

  # Never path-filtered. Called workflow jobs get at most these permissions.
  security:
    name: security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # size label only (pr-hygiene.yml size-label job)
    uses: $/.github/workflows/pr-hygiene.yml

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, pr-hygiene, python, python-test, sim-determinism, overlay, overlay-test, contracts, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate job results
        env:
          # PRs: target branch. Pushes: the branch pushed to.
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          R_CHANGES: ${{ needs.changes.result }}
          R_PR_HYGIENE: ${{ needs.pr-hygiene.result }}
          R_PYTHON: ${{ needs.python.result }}
          R_PYTHON_TEST: ${{ needs.python-test.result }}
          R_SIM_DETERMINISM: ${{ needs.sim-determinism.result }}
          R_OVERLAY: ${{ needs.overlay.result }}
          R_OVERLAY_TEST: ${{ needs.overlay-test.result }}
          R_CONTRACTS: ${{ needs.contracts.result }}
          R_SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          advisory=false
          if [ "$TARGET_BRANCH" = "develop" ]; then advisory=true; fi
          echo "Target branch: $TARGET_BRANCH (tests advisory: $advisory)"
          fail=0
          check() { # name result is_test
            case "$2" in
              success|skipped) echo "ok    $1 ($2)" ;;
              *)
                if [ "$3" = "test" ] && [ "$advisory" = "true" ]; then
                  echo "::warning title=Advisory test failure::$1 is $2. Advisory on develop (ADR-0009); open a tracker issue within 24 h."
                else
                  echo "::error title=Required check failed::$1 is $2"
                  fail=1
                fi ;;
            esac
          }
          check changes "$R_CHANGES" required
          check pr-hygiene "$R_PR_HYGIENE" required
          check python "$R_PYTHON" required
          check python-test "$R_PYTHON_TEST" test
          check sim-determinism "$R_SIM_DETERMINISM" test
          check overlay "$R_OVERLAY" required
          check overlay-test "$R_OVERLAY_TEST" test
          check contracts "$R_CONTRACTS" required
          check security "$R_SECURITY" required
          exit "$fail"
