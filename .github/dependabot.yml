# Grouped weekly version updates (NX-018, CICD-ARCHITECTURE §10).
# One PR per ecosystem per week. PRs target the default branch (`develop`).
# Commit prefixes keep Dependabot commits and PR titles Conventional
# (scripts/check_commit_msg.py, pr-hygiene). Docker is added with the first
# Dockerfile (NX-013); Dependabot errors on a directory with no manifest.
version: 2
updates:
  - package-ecosystem: uv
    directory: /services/sim
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/overlay
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      overlay:
        patterns: ["*"]
    # typescript-eslint (latest 8.71.2) supports typescript >=4.8.4 <6.1.0, so pnpm
    # rejects the typescript 7 bump and this job errors every week. Remove this
    # ignore once typescript-eslint declares support for typescript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
