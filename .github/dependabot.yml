# Grouped weekly version updates (NX-018, CICD-ARCHITECTURE §10).
# One PR per ecosystem per week. PRs target the default branch (`develop`).
# Commit prefixes keep Dependabot commits and PR titles Conventional
# (scripts/check_commit_msg.py, pr-hygiene). Docker is added with the first
# Dockerfile (NX-013); Dependabot errors on a directory with no manifest.
version: 2
updates:
  - package-ecosystem: uv
    directory: /services/sim
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/overlay
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      overlay:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
