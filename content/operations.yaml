# The Threat Director's operation catalog (CONFIG-AND-CONTENT §8a, THREAT-DIRECTOR §4, Q-TD-7, Q-SIM-81).
# Content, not code: a job template per operation, posted on the Static's Tasking Board; each later job waits for the one
# before it (TB-8). Costs are the owner-approved starting numbers (Q-SIM-78), PROPOSED, tuned by the balance harness (NX-031).
# Priority is not here: it is `director.op_priority.<id>` in balance/default.yaml. One unit is bought per slot, spawned by
# GP-7 parity (THREAT-DIRECTOR §4 step 7). `enabled_tiers` follow THREAT-DIRECTOR §3: Pattern of Life is routine only
# (Recon, EscortConvoys, DecoyBlink, GarrisonUpkeep); the rest need ALPHA.
schema_version: 1
operations:
  - id: OFFENSIVE            # stage 2 armor at the nearest own base, 2 strike jets on the target's defenses, 2 armor capture
    target: NODE
    preconditions: [target_owner_is_coalition, target_in_enemy_view, target_capturable]
    cost: 60                 # PROPOSED – unvalidated (Q-SIM-78)
    enabled_tiers: [ALPHA, BRAVO]
    jobs:
      - { kind: STAGE,   at: nearest_own_base, unit_kinds: [ENEMY_ARMOR],          slots: 2 }
      - { kind: STRIKE,  at: target_defenses,  unit_kinds: [ENEMY_STRIKE_FIGHTER], slots: 2 }
      - { kind: CAPTURE, at: target,           unit_kinds: [ENEMY_ARMOR],          slots: 2 }
  - id: RETAKE               # a base lost in the last 30 game minutes: 1 strike jet on its defenses, then 3 armor capture
    target: NODE
    preconditions: [target_owner_is_coalition, target_in_enemy_view, target_capturable, target_recently_lost]
    cost: 50                 # PROPOSED – unvalidated (Q-SIM-78)
    enabled_tiers: [ALPHA, BRAVO]
    memory: { counter: node_losses_by_sector, effect: RAISE }    # bases lost in the target's sector
    jobs:
      - { kind: STRIKE,  at: target_defenses, unit_kinds: [ENEMY_STRIKE_FIGHTER], slots: 1 }
      - { kind: CAPTURE, at: target,          unit_kinds: [ENEMY_ARMOR],          slots: 3 }
  - id: PROBE                # 1 strike jet on the defenses of a coalition base on the front
    target: NODE
    preconditions: [target_owner_is_coalition, target_in_enemy_view, target_is_frontline]
    cost: 15                 # PROPOSED – unvalidated (Q-SIM-78)
    enabled_tiers: [ALPHA, BRAVO]
    jobs:
      - { kind: STRIKE, at: target_defenses, unit_kinds: [ENEMY_STRIKE_FIGHTER], slots: 1 }
  - id: STRIKE_BRIDGE        # 2 strike jets drop a bridge on the coalition's lifeline to a node it holds (NX-401, Q-SIM-120, Q-SIM-121)
    target: NODE
    preconditions: [target_is_bridge, target_bridge_intact, target_bridge_off_cooldown, no_bridge_contested, target_feeds_coalition_node]
    cost: 30                 # PROPOSED – unvalidated (Q-SIM-121): 2 jets at PROBE's rate; the ALPHA budget, so it still runs there
    enabled_tiers: [ALPHA, BRAVO]   # never at Pattern of Life (Q-SIM-112)
    jobs:                    # no STAGE: jets spawn at an airbase (Q-SIM-121)
      - { kind: STRIKE, at: target, unit_kinds: [ENEMY_STRIKE_FIGHTER], slots: 2 }
  - id: RECON                # 1 recon UAV loiters at the stalest point of a sector outside the known air-defense rings (Q-SIM-87)
    target: SECTOR
    preconditions: []
    cost: 2                  # PROPOSED – unvalidated (Q-SIM-87; 5 in Q-SIM-78): scouts that avoid known air defenses are lost less
    enabled_tiers: [PATTERN_OF_LIFE, ALPHA, BRAVO]
    memory: { counter: recon_losses_by_sector, effect: LOWER }   # fewer where scouts were lost
    track_age: true                                              # more where the picture is stale (TD-5)
    jobs:
      - { kind: SCOUT, at: sector_point, unit_kinds: [ENEMY_RECON_UAV], slots: 1 }
  - id: ESCORT_CONVOYS       # 1 fighter follows each unescorted Static convoy
    target: CONVOYS
    preconditions: [has_unescorted_convoy]
    cost: 10                 # PROPOSED – unvalidated (Q-SIM-82; 20 in Q-SIM-78): Pattern of Life can afford it
    enabled_tiers: [PATTERN_OF_LIFE, ALPHA, BRAVO]
    memory: { counter: convoy_attacks, effect: RAISE }
    jobs:
      - { kind: ESCORT_CONVOY, at: each_convoy, unit_kinds: [ENEMY_FIGHTER], slots: 1 }
  - id: REINFORCE_IADS       # 1 convoy resupplies the base whose air-defense site is damaged (stock repairs it)
    target: NODE
    preconditions: [target_has_damaged_air_defense]
    cost: 15                 # PROPOSED – unvalidated (Q-SIM-78)
    enabled_tiers: [ALPHA, BRAVO]
    memory: { counter: radar_strikes, effect: RAISE }
    jobs:
      - { kind: RESUPPLY, at: target, unit_kinds: [ENEMY_CONVOY], slots: 1 }
  - id: DECOY_BLINK          # a radar goes dark for a while, directly (FOW-11, Q-SIM-82); no units, no jobs
    target: RADAR
    preconditions: [target_radar_operational]
    cost: 0                  # PROPOSED – unvalidated (Q-SIM-78)
    enabled_tiers: [PATTERN_OF_LIFE, ALPHA, BRAVO]
    effect: EMISSION_BLINK
  - id: GARRISON_UPKEEP      # one replacement unit staged at a Static base below its garrison_quota; the kind is director.garrison.kinds (Q-SIM-85)
    target: GARRISON
    preconditions: []
    cost: 8                  # PROPOSED – unvalidated (Q-SIM-85): between Recon (5) and Escort (10); the same for every kind
    enabled_tiers: [PATTERN_OF_LIFE, ALPHA, BRAVO]
    jobs:
      - { kind: STAGE, at: target, slots: 1 }
