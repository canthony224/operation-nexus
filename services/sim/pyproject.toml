[project]
name = "nexus"
version = "0.0.0"
description = "Operation Nexus simulation and app (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "msgpack==1.2.3",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "hypothesis==6.170.1",
  "import-linter==2.15",
  "datamodel-code-generator==0.86.0",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Generated contract types (NX-021): long schema descriptions stay on one line.
"src/nexus/contracts/gen/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["msgpack"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "nexus"

[[tool.importlinter.contracts]]
name = "Core is pure: no I/O or vendor-facing modules (ADR-0001, ADR-0010)"
type = "forbidden"
source_modules = ["nexus.core"]
forbidden_modules = [
  "nexus.gateway",
  "nexus.persistence",
  "nexus.broadcast",
  "nexus.advisors",
  "nexus.audio",
  "nexus.clips",
  "nexus.ops",
]

# SYSTEM-DESIGN §4 "Must not" column (NX-019, Q-MB-1). The read-only rules for
# broadcast and ops are not import rules; tests and review cover them.
[[tool.importlinter.contracts]]
name = "Boundary modules never import the kernel (SYSTEM-DESIGN §4)"
type = "forbidden"
source_modules = [
  "nexus.gateway",
  "nexus.commands",
  "nexus.progression",
  "nexus.persistence",
  "nexus.advisors",
]
forbidden_modules = ["nexus.core"]

[[tool.importlinter.contracts]]
name = "Contracts are leaf types: they import nothing else from nexus (SYSTEM-DESIGN §4)"
type = "forbidden"
source_modules = ["nexus.contracts"]
forbidden_modules = [
  "nexus.core",
  "nexus.runtime",
  "nexus.gateway",
  "nexus.commands",
  "nexus.moderation",
  "nexus.broadcast",
  "nexus.progression",
  "nexus.persistence",
  "nexus.advisors",
  "nexus.audio",
  "nexus.clips",
  "nexus.ops",
]

[[tool.importlinter.contracts]]
name = "nexus.obs is a leaf: it imports nothing else from nexus (SYSTEM-DESIGN §4, Q-DEV-20)"
type = "forbidden"
source_modules = ["nexus.obs"]
forbidden_modules = [
  "nexus.contracts",
  "nexus.core",
  "nexus.runtime",
  "nexus.gateway",
  "nexus.commands",
  "nexus.moderation",
  "nexus.broadcast",
  "nexus.progression",
  "nexus.persistence",
  "nexus.advisors",
  "nexus.audio",
  "nexus.clips",
  "nexus.ops",
]
