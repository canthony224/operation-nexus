# Default balance profile (CONFIG-AND-CONTENT §4.1, §6). Schema: contracts/config/balance.json.
# Keys land with the code that reads them (NX-106 onward). Values are PROPOSED and unvalidated
# until the balance harness (NX-031) validates them (DATA-INTEGRITY DI-7).
schema_version: 1
sim:
  tick_hz: 10  # Hz; fixed by ADR-0002, validated, not tunable (CONFIG-AND-CONTENT §6.1 sim.tick_hz)
  time_scale: 6.0  # PROPOSED – unvalidated; x real time (CONFIG-AND-CONTENT §6.1 sim.time_scale)
  snapshot_every_ticks: 300  # PROPOSED – unvalidated; ticks (CONFIG-AND-CONTENT §6.1 sim.snapshot_every_ticks)
slots:
  max_live_per_commander: 1  # PROPOSED – unvalidated; units (CONFIG-AND-CONTENT §6.2 slots.max_live_per_commander)
  respawn_delay_s: 20  # PROPOSED – unvalidated; s (game) (CONFIG-AND-CONTENT §6.2 slots.respawn_delay_s)
  max_viewer_units: 500  # PROPOSED – unvalidated; units (CONFIG-AND-CONTENT §6.2 slots.max_viewer_units)
  reserve_queue_max: 1000  # PROPOSED – unvalidated; entries (CONFIG-AND-CONTENT §6.2 slots.reserve_queue_max)
air:
  bingo_reserve_frac: 0.15  # PROPOSED – unvalidated; fraction of fuel_s (CONFIG-AND-CONTENT §6.1 air.bingo_reserve_frac)
  orbit_period_s: 120.0  # PROPOSED – unvalidated; s (world) (CONFIG-AND-CONTENT §6.1 air.orbit_period_s)
fow:
  track_every_ticks: 5  # PROPOSED – unvalidated; ticks, 0.5 s game (CONFIG-AND-CONTENT §6.1 fow.track_every_ticks)
  track_fade_s: 180.0  # PROPOSED – unvalidated (NX-150); s (world), 30 real s at 6x (CONFIG-AND-CONTENT §6.1 fow.track_fade_s)
