    strike: 2
    assist_objective: 4
    scout: 1
    escort_convoy: 2  # PROPOSED – unvalidated (Q-SIM-73)
    patrol: 2  # PROPOSED – unvalidated (Q-SIM-94, NX-382); a coalition front-line patrol
    intercept: 1  # PROPOSED – unvalidated (Q-SIM-96, NX-382); one interceptor per scout
    repair_bridge: 2  # PROPOSED – unvalidated (Q-SIM-101, NX-373 part 2); trucks per down bridge
  resupply_stock_per_slot: 100  # PROPOSED – unvalidated (Q-SIM-73); stock units, one resupply slot per this much missing stock (CONFIG-AND-CONTENT §6.6)
  resupply_slots_max: 3  # PROPOSED – unvalidated (Q-SIM-73); units (CONFIG-AND-CONTENT §6.6)
  defend_radius_m: 10000  # PROPOSED – unvalidated (Q-SIM-74); m, a tracked enemy ground unit this close to a base posts a defend job (CONFIG-AND-CONTENT §6.6)
  counterattack_window_min: 15  # PROPOSED – unvalidated (Q-SIM-74, Q-GD-31); min (game), the AI garrison may counterattack a node just lost (CONFIG-AND-CONTENT §6.6)
  capture_max_restarts: 3  # PROPOSED – unvalidated (Q-SIM-84); fresh expiries for a capture run still driving
  scout_post_interval_min: 2  # PROPOSED – unvalidated (Q-DEV-21); min (game), at most one new generated scout job per board per interval
  scout_open_max: 3  # PROPOSED – unvalidated (Q-SIM-82); open generated scout jobs a board holds at once
  scout_cooldown_min: 5  # PROPOSED – unvalidated (Q-SIM-75); min (game), a scouted cell is not posted again (CONFIG-AND-CONTENT §6.6)
  follow_station_m:  # PROPOSED – unvalidated (Q-SIM-76, owner-approved start; NX-031 tunes); m (CONFIG-AND-CONTENT §6.6 tasking.follow_station_m.<pairing>)
    escort: 500  # a ground combat unit ahead of its truck or convoy on the same road
    column: 200  # a ground unit behind its ground leader
    overwatch: 3000  # an aircraft orbits within this of the ground unit it covers
    wingman: 1000  # an aircraft this far off its aircraft lead
  escort_threat_memory_s: 60  # PROPOSED – unvalidated (Q-SIM-76); s (world), a tracked enemy that fired at a group member this recently is a group threat (CONFIG-AND-CONTENT §6.6)
