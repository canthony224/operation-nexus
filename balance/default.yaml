  ai_jobs: [DEFEND, RESUPPLY, SCOUT, REPAIR_BRIDGE]  # decided rule as default, Q-CFG-16 option (Q-GD-26); job kinds the AI garrison takes by itself (CONFIG-AND-CONTENT §6.6)
