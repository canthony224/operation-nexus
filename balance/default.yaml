# Default balance profile (CONFIG-AND-CONTENT §4.1, §6). Schema: contracts/config/balance.json.
# Keys land with the code that reads them (NX-106 onward). Values are PROPOSED and unvalidated
# until the balance harness (NX-031) validates them (DATA-INTEGRITY DI-7).
schema_version: 1
sim:
  tick_hz: 10  # Hz; fixed by ADR-0002, validated, not tunable (CONFIG-AND-CONTENT §6.1 sim.tick_hz)
  time_scale: 6.0  # PROPOSED – unvalidated; x real time (CONFIG-AND-CONTENT §6.1 sim.time_scale)
  snapshot_every_ticks: 300  # PROPOSED – unvalidated; ticks (CONFIG-AND-CONTENT §6.1 sim.snapshot_every_ticks)
slots:
  max_live_per_commander: 1  # PROPOSED – unvalidated; units (CONFIG-AND-CONTENT §6.2 slots.max_live_per_commander)
  respawn_delay_s: 20  # PROPOSED – unvalidated; s (game) (CONFIG-AND-CONTENT §6.2 slots.respawn_delay_s)
  max_viewer_units: 500  # PROPOSED – unvalidated; units (CONFIG-AND-CONTENT §6.2 slots.max_viewer_units)
  queue_idle_min: 15  # PROPOSED – unvalidated; min (real time) (CONFIG-AND-CONTENT §6.2 slots.queue_idle_min); read by the runtime, not the sim
  reserve_queue_max: 1000  # PROPOSED – unvalidated; entries (CONFIG-AND-CONTENT §6.2 slots.reserve_queue_max)
  rebase_order: HOLD  # decided rule as default, Q-CFG-16 option (Q-SIM-90); the order a rebased unit is left with, the only value today (CONFIG-AND-CONTENT §6.2)
air:
  bingo_reserve_frac: 0.15  # PROPOSED – unvalidated; fraction of fuel_s (CONFIG-AND-CONTENT §6.1 air.bingo_reserve_frac)
  orbit_period_s: 120.0  # PROPOSED – unvalidated; s (world) (CONFIG-AND-CONTENT §6.1 air.orbit_period_s)
  landing_node_kinds: [AIRBASE, SANCTUARY]  # decided rule as default, Q-DEV-21 option; node kinds an aircraft may land at (CONFIG-AND-CONTENT §6.1 air.landing_node_kinds)
fow:
  track_every_ticks: 5  # PROPOSED – unvalidated; ticks, 0.5 s game (CONFIG-AND-CONTENT §6.1 fow.track_every_ticks)
  track_fade_s: 180.0  # PROPOSED – unvalidated (NX-150); s (world), 30 real s at 6x (CONFIG-AND-CONTENT §6.1 fow.track_fade_s)
  sigint_range_mult: 1.5  # PROPOSED – unvalidated (NX-150); x a radar site's sensor.radius_m, 180 km for a 120 km radar (CONFIG-AND-CONTENT §6.1 fow.sigint_range_mult)
  sigint_refresh_s: 54.0  # PROPOSED – unvalidated (NX-150, Q-ALN-38: 48–60); s (world), 90 ticks, 9 real s at 6x (CONFIG-AND-CONTENT §6.1 fow.sigint_refresh_s)
  mask_cell_m: 1000  # PROPOSED – unvalidated (NX-150, Q-FOW-3, Q-DEV-21); m, the terrain-masking raster cell, finer than the SIGINT cell (CONFIG-AND-CONTENT §6.1 fow.mask_cell_m)
  masked_alt_bands: [NOE, LOW]  # decided rule as default, Q-DEV-21 option; altitude bands terrain masking hides (CONFIG-AND-CONTENT §6.1 fow.masked_alt_bands)
  sigint_cell_m: 10000  # PROPOSED – unvalidated; m (CONFIG-AND-CONTENT §6.1 fow.sigint_cell_m)
  sigint_size_m_min: 3  # PROPOSED – unvalidated (NX-150); units: a blob of 3-6 reads M, 1-2 S (CONFIG-AND-CONTENT §6.1 fow.sigint_size_m_min)
  sigint_size_l_min: 7  # PROPOSED – unvalidated (NX-150); units: a blob of 7 or more reads L (CONFIG-AND-CONTENT §6.1 fow.sigint_size_l_min)
  paint_range_m: 20000.0  # PROPOSED – unvalidated (NX-150); m, a third of a recon UAV's 60 km sensor (CONFIG-AND-CONTENT §6.1 fow.paint_range_m)
logistics:
  node_max_stock:  # PROPOSED – unvalidated (Q-SIM-49, owner-approved initial values; NX-031 tunes); stock units, SANCTUARY is infinite
    AIRBASE: 2000
    BRIDGE: 0
    FOB: 1000
    HQ: 2000
    PORT: 1000
  starve_threshold: 0.25  # PROPOSED – unvalidated (Q-SIM-49); fraction of node_max_stock (CONFIG-AND-CONTENT §6.3 logistics.starve_threshold)
  stock_target_frac: 0.8  # PROPOSED – unvalidated (Q-SIM-100, Q-SIM-102, NX-389); fraction of node_max_stock, a base below it gets a stocking resupply job and a run to it loads only stock above a source's own target (CONFIG-AND-CONTENT §6.3)
  truck_cargo: 100  # PROPOSED – unvalidated (Q-SIM-49); stock units (CONFIG-AND-CONTENT §6.3 logistics.truck_cargo)
  unload_rate: 1.0  # PROPOSED – unvalidated (Q-SIM-49); stock per s (world) (CONFIG-AND-CONTENT §6.3 logistics.unload_rate)
  rearm_rate: 0.5  # PROPOSED – unvalidated (Q-SIM-49); stock per s (world) (CONFIG-AND-CONTENT §6.3 logistics.rearm_rate)
  forward_deploy_min_surplus: 50  # PROPOSED – unvalidated (Q-SIM-49); stock above the starvation floor (CONFIG-AND-CONTENT §6.3)
  starved_loadout:
    fuel_frac: 0.5  # PROPOSED – unvalidated (Q-SIM-53); fraction of fuel_s a starved base refuels up to (CONFIG-AND-CONTENT §6.3)
  loadout_cost:  # PROPOSED – unvalidated (Q-SIM-49, owner-approved initial values; NX-031 tunes); stock units, a full loadout / a full refill
    ENEMY_ARMOR: 15
    ENEMY_CONVOY: 0
    ENEMY_FIGHTER: 20
    ENEMY_RECON_UAV: 5
    ENEMY_STRIKE_FIGHTER: 20
    GARRISON_INFANTRY: 5
    LOGI_TRUCK: 0
    RECON_UAV: 5
    STRIKE_FIGHTER: 20
  repair_rate:  # PROPOSED – unvalidated (Q-SIM-68, owner-approved; NX-031 tunes); hp per s (world) at a friendly base of each kind, SANCTUARY is free (CONFIG-AND-CONTENT §6.3 logistics.repair_rate)
    AIRBASE: 1.0
    FOB: 0.5
    HQ: 1.0
    PORT: 1.0
    SANCTUARY: 2.0
  facility_rearm_cost: 10  # PROPOSED – unvalidated (Q-SIM-69, owner-approved); stock units for a full reload of a facility, by ammo share (CONFIG-AND-CONTENT §6.3)
  ammo_loadout_share: 0.5  # PROPOSED – unvalidated (Q-SIM-69, Q-DEV-21); of a loadout_cost, the share ammo costs for a kind with ammo and fuel, fuel pays the rest (CONFIG-AND-CONTENT §6.3)
  facility_repair_hp_per_stock: 10  # PROPOSED – unvalidated (Q-SIM-68, owner-approved); hp a facility regains per stock unit of its base (CONFIG-AND-CONTENT §6.3)
  starve_hp_drain_per_min: 5  # PROPOSED – unvalidated (Q-SIM-71, owner-approved; NX-031 tunes); defense hp a base below its starvation floor loses per min (game) (CONFIG-AND-CONTENT §6.3)
  defense_repair_hp_per_stock: 2  # PROPOSED – unvalidated (Q-SIM-71, owner-approved; NX-031 tunes); defense hp one stock unit unloaded into a node rebuilds (CONFIG-AND-CONTENT §6.3)
  bridge_hp: 300  # PROPOSED – unvalidated (Q-SIM-101, next to FOB defense hp 300; NX-031 tunes); hp, max hp of every BRIDGE node, 0 cuts its road until repaired (CONFIG-AND-CONTENT §6.3)
  bridge_collapse_radius_m: 1000.0  # PROPOSED – unvalidated (Q-SIM-112, owner; NX-031 tunes); m along the cut edge from the cut point within which GROUND units on it are destroyed when a bridge falls (CONFIG-AND-CONTENT §6.3)
  bridge_repair_time_s: 600.0  # PROPOSED – unvalidated (Q-SIM-101, Q-GD-11; NX-031 tunes); s (world), an engineer's repair of a bridge from 0 to full; engineers are not in code yet, a truck's rate derives from it (CONFIG-AND-CONTENT §6.3)
  truck_bridge_repair_mult: 5.0  # PROPOSED – unvalidated (Q-GD-11 "e.g. 5x slower", Q-SIM-101); multiplier, one truck takes 600 x 5 = 3000 world s for a 300 hp bridge (CONFIG-AND-CONTENT §6.3)
capture:
  radius_m: 2000.0  # PROPOSED – unvalidated (Q-SIM-57, owner-approved initial value; NX-031 tunes); m (CONFIG-AND-CONTENT §6.5 capture.radius_m)
  time_s: 120.0  # PROPOSED – unvalidated; s (world), one capturer, no modifiers (CONFIG-AND-CONTENT §6.5 capture.time_s)
  multi_unit_exponent: 0.5  # PROPOSED – unvalidated (Q-SIM-26); exponent: time ÷ n^0.5 (CONFIG-AND-CONTENT §6.5)
  quiet_floor: 0.6  # PROPOSED – unvalidated (Q-SIM-26); multiplier at 0 viewer units, for the quiet_sides (CONFIG-AND-CONTENT §6.5)
  quiet_ref: 50  # PROPOSED – unvalidated (Q-SIM-26); viewer units at which the multiplier reaches 1.0 (CONFIG-AND-CONTENT §6.5)
  min_time_s: 30.0  # PROPOSED – unvalidated (Q-SIM-26, Q-GP-4); s (world) (CONFIG-AND-CONTENT §6.5)
  logi_weight: 0.5  # PROPOSED – unvalidated (Q-SM-7); a logistics unit counts as half a capturer (CONFIG-AND-CONTENT §6.5)
  garrison_mult: 3.0  # PROPOSED – unvalidated (Q-SM-8); capture-time multiplier, a defender that cannot contest is at the base (CONFIG-AND-CONTENT §6.5)
  empty_base_mult: 0.5  # PROPOSED – unvalidated (Q-SM-8); capture-time multiplier, no defender at the base (CONFIG-AND-CONTENT §6.5)
  min_progress_per_tick: 1  # PROPOSED – unvalidated (Q-SIM-57, Q-DEV-21); millionths of a percent of the bar per tick, the least a capture gains however slow the time (CONFIG-AND-CONTENT §6.5)
  decay_per_s: 0.008333333333333333  # PROPOSED – unvalidated (Q-SIM-57, owner-approved initial value; NX-031 tunes); 1/120 of the bar per s (world) (CONFIG-AND-CONTENT §6.5)
  defense_hp:  # PROPOSED – unvalidated (Q-SIM-71, owner-approved; NX-031 tunes); max defense hp by node kind, an owned node starts full, a NEUTRAL one at 0 (CONFIG-AND-CONTENT §6.5)
    AIRBASE: 500
    FOB: 300
    HQ: 800
    PORT: 300
    SANCTUARY: 1000
  sanctuary_repair_hp_per_s: 1.0  # PROPOSED – unvalidated (Q-SIM-71, owner-approved; NX-031 tunes); defense hp per s (world) per logistics unit parked at its sanctuary (CONFIG-AND-CONTENT §6.5)
  uncapturable_node_kinds: [SANCTUARY, BRIDGE]  # decided rule as default, Q-DEV-21 option; node kinds never captured (CONFIG-AND-CONTENT §6.5 capture.uncapturable_node_kinds)
  requires_defenses_down: true  # decided rule as default, Q-CFG-16 option (Q-GD-18); a capture bar starts only at 0 defense hp (CONFIG-AND-CONTENT §6.5)
  air_counts: false  # decided rule as default, Q-CFG-16 option (N-3, Q-GP-38); airborne aircraft never capture (CONFIG-AND-CONTENT §6.5)
  air_weight: 1.0  # Q-CFG-16 option; capturer weight of an airborne aircraft, read only when air_counts is true (CONFIG-AND-CONTENT §6.5)
  quiet_sides: [COALITION]  # decided rule as default, Q-CFG-16 option (Q-SIM-26); sides that get the quiet-stream multiplier (CONFIG-AND-CONTENT §6.5)
combat:
  pk_cap: 0.95  # PROPOSED – unvalidated (Q-CBT-10); max hit probability, every shot can miss (CONFIG-AND-CONTENT §6.4 combat.pk_cap)
  track_quality:
    track: 1.0  # PROPOSED – unvalidated (Q-CBT-10); Pk multiplier, a tracked target (CONFIG-AND-CONTENT §6.4)
    painted: 1.25  # PROPOSED – unvalidated (Q-CBT-10); Pk multiplier, a target painted by recon (CONFIG-AND-CONTENT §6.4)
  range:
    full_pk_frac: 0.5  # PROPOSED – unvalidated (Q-CBT-10); share of range_m with the full range factor (CONFIG-AND-CONTENT §6.4)
    min_mult: 0.5  # PROPOSED – unvalidated (Q-CBT-10); range factor at range_m (CONFIG-AND-CONTENT §6.4)
  pk_mult:
    terrain_masked: 0.5  # PROPOSED – unvalidated (Q-CBT-11); Pk multiplier, NOE/LOW aircraft or a ground unit in a masking region (CONFIG-AND-CONTENT §6.4)
  damage_state:
    damaged_below: 0.70  # PROPOSED – unvalidated (Q-GP-8); hp fraction (CONFIG-AND-CONTENT §6.4)
    mission_kill_below: 0.35  # PROPOSED – unvalidated (Q-GP-8); hp fraction (CONFIG-AND-CONTENT §6.4)
    disabled_below: 0.10  # PROPOSED – unvalidated (Q-GP-8); hp fraction, a facility's hp floors here (CONFIG-AND-CONTENT §6.4)
    damaged_speed_mult: 0.75  # PROPOSED – unvalidated (Q-SIM-65); multiplier on top speed at Damaged or worse (CONFIG-AND-CONTENT §6.4)
    damaged_sensor_mult: 0.8  # PROPOSED – unvalidated (Q-SIM-65); multiplier on sensor radius at Damaged or worse (CONFIG-AND-CONTENT §6.4)
  disabled_timeout_s: 600  # PROPOSED – unvalidated (Q-CBT-14); s (game), a Disabled unit is removed after this (CONFIG-AND-CONTENT §6.4)
  min_damage: 1  # PROPOSED – unvalidated (Q-CBT-10, Q-DEV-21); hp, the least a hit takes off a target however heavy its armor (CONFIG-AND-CONTENT §6.4)
  assist_window_s: 120  # PROPOSED – unvalidated (Q-SIM-66); s (game), a hit this recently before a kill is an assist (CONFIG-AND-CONTENT §6.4)
  crew_survival:  # PROPOSED – unvalidated (Q-SIM-68, owner-approved; NX-031 tunes); probability a crew is DOWNED, not LOST (CONFIG-AND-CONTENT §6.4 combat.crew_survival)
    ENEMY_ARMOR: 0.60
    ENEMY_CONVOY: 0.70
    ENEMY_FIGHTER: 0.75
    ENEMY_STRIKE_FIGHTER: 0.75
    GARRISON_INFANTRY: 0.50
    LOGI_TRUCK: 0.70
    STRIKE_FIGHTER: 0.75
  crew_marker_min: 10  # PROPOSED – unvalidated (Q-SIM-68, owner-approved); min (game), a downed crew is a map marker this long (CONFIG-AND-CONTENT §6.4)
  facility_indestructible: true  # decided rule as default, Q-CFG-16 option (CB-9, Q-GP-37); a facility's hp floors at Disabled, never Destroyed (CONFIG-AND-CONTENT §6.4)
campaign:
  time_limit_h: 72  # PROPOSED – unvalidated (Q-TEST-6); h (game) (CONFIG-AND-CONTENT §6.6 campaign.time_limit_h)
  victory_node_frac: 0.80  # PROPOSED – unvalidated; fraction of strategic nodes (CONFIG-AND-CONTENT §6.6)
  strategic_node_kinds: [AIRBASE, FOB, PORT]  # decided rule as default, Q-DEV-21 option; node kinds that count toward the hold fractions and the score (CONFIG-AND-CONTENT §6.6 campaign.strategic_node_kinds)
  victory_hold_min: 30  # PROPOSED – unvalidated; min (game), held without a dip (CONFIG-AND-CONTENT §6.6)
  objective_period_min: 15  # PROPOSED – unvalidated; min (game), how long an objective lasts (CONFIG-AND-CONTENT §6.6)
  defeat:
    hold_min: 30  # PROPOSED – unvalidated (Q-TH-7); min (game), the coalition sanctuary's defense HP stays at 0 this long to lose (CONFIG-AND-CONTENT §6.6)
  objective_mode: timed  # timed (Q-GD-19); set per campaign by the owner or an admin (CONFIG-AND-CONTENT §6.6)
  objective_pick: uniform  # decided rule as default, Q-CFG-16 option; the only value today (CONFIG-AND-CONTENT §6.6)
  victory:
    hq_capture: true  # decided rule as default, Q-CFG-16 option; capturing the enemy HQ wins at once (CONFIG-AND-CONTENT §6.6)
  idle_floor:  # decided rule as default, Q-CFG-16 option (Q-GP-28, Q-GP-44); with no live viewer unit (CONFIG-AND-CONTENT §6.6)
    enabled: true
    sanctuary_min_hp: 1  # hp, the coalition sanctuary's floor while the idle floor holds
  score:
    average_weight: 50  # PROPOSED – unvalidated (Q-SIM-64); points x a side's average share of strategic nodes over the campaign (CONFIG-AND-CONTENT §6.6)
    final_weight: 50  # PROPOSED – unvalidated (Q-SIM-64); points x a side's share of strategic nodes at the final tick (CONFIG-AND-CONTENT §6.6)
    objective_points: 5  # PROPOSED – unvalidated (Q-SM-9); points per completed objective, coalition (CONFIG-AND-CONTENT §6.6)
  night_progress_cap_nodes_per_h: 0.16666666666666666  # PROPOSED – unvalidated (Q-ALN-23, Q-SIM-85); nodes/h (game), 1/6: with no viewer unit the Static flips at most one node per 6 game hours (CONFIG-AND-CONTENT §6.6)
  momentum:
    nodes_weight: 70  # PROPOSED – unvalidated (Q-SIM-60); percentage points x the coalition's share of strategic nodes (CONFIG-AND-CONTENT §6.6)
    supply_weight: 30  # PROPOSED – unvalidated (Q-SIM-60); percentage points x the coalition's supply fill (CONFIG-AND-CONTENT §6.6)
tasking:
