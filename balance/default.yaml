  claim_lease_s: 120  # PROPOSED – unvalidated (Q-SIM-73); s (game) (CONFIG-AND-CONTENT §6.6 tasking.claim_lease_s)
  expire_min: 15  # PROPOSED – unvalidated (Q-SIM-73); min (game), unclaimed jobs (CONFIG-AND-CONTENT §6.6 tasking.expire_min)
