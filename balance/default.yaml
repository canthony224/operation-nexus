# Default balance profile (CONFIG-AND-CONTENT §4.1, §6). Schema: contracts/config/balance.json.
# Keys land with the code that reads them (NX-106 onward). Values are PROPOSED and unvalidated
# until the balance harness (NX-031) validates them (DATA-INTEGRITY DI-7).
