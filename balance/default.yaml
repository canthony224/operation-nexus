  strike_idle_targets_min_tier: ALPHA  # PROPOSED – unvalidated (Q-SIM-92, Q-SIM-86); the lowest Director tier at which idle armed viewer units get strike jobs on known defended foe nodes; below it a lone new viewer provokes nothing (CONFIG-AND-CONTENT §6.6)
