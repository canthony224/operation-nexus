    patrol: 15  # PROPOSED – unvalidated (Q-SIM-85, lead decision): below stage, so an idle unit never prefers a patrol; the Director's patrol is taken at posting
    repair_bridge: 45  # PROPOSED – unvalidated (Q-SIM-101, NX-373 part 2): below resupply, as assist_objective; trucks are the only fitting units
  urgency_max: 2.0  # PROPOSED – unvalidated (Q-GP-20, Q-SIM-73); multiplier, a triggering condition's least is 1.0; a stocking job runs below (CONFIG-AND-CONTENT §6.6)
  priority_aging_per_min: 1  # PROPOSED – unvalidated (Q-SIM-73); points per min (game) (CONFIG-AND-CONTENT §6.6)
  slots:  # PROPOSED – unvalidated (Q-SIM-73); units per lower-case JobKind (CONFIG-AND-CONTENT §6.6 tasking.slots.<job_kind>)
