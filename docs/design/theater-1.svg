<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif" font-size="12">
  <title>Theater #1 "Strait One" sketch (NX-008, Q-TH-1..7). 1 px = 0.5 km. Coalition west, Static east.</title>
  <rect x="0" y="0" width="800" height="480" fill="#eef1ec" stroke="#555"/>
  <!-- sectors -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#999" stroke-dasharray="6 4"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#999" stroke-dasharray="6 4"/>
  <text x="8" y="18" fill="#666">NORTH</text><text x="8" y="178" fill="#666">CENTRE (air only across the strait)</text><text x="8" y="338" fill="#666">SOUTH</text>
  <!-- masking regions -->
  <rect x="300" y="0" width="220" height="70" fill="#9b8f6a" opacity="0.35"/><text x="306" y="40" fill="#5a5130">northern hills (masking)</text>
  <rect x="460" y="410" width="200" height="70" fill="#9b8f6a" opacity="0.35"/><text x="466" y="450" fill="#5a5130">southern valley (masking)</text>
  <!-- strait -->
  <rect x="380" y="0" width="40" height="480" fill="#8fb3d9"/><text x="384" y="250" fill="#24496e" transform="rotate(-90 400 250)">STRAIT</text>
  <!-- roads -->
  <g stroke="#6b5b3e" stroke-width="3" fill="none">
    <path d="M40 240 L180 240"/><path d="M180 240 L260 120"/><path d="M180 240 L260 360"/>
    <path d="M260 120 L460 120"/><path d="M260 360 L460 360"/>
    <path d="M460 120 L580 80"/><path d="M460 360 L580 400"/><path d="M460 120 L620 240"/><path d="M460 360 L620 240"/>
    <path d="M580 80 L760 240"/><path d="M580 400 L760 240"/><path d="M620 240 L760 240"/>
  </g>
  <!-- bridges -->
  <rect x="390" y="112" width="20" height="16" fill="#333"/><text x="368" y="104">North Bridge</text>
  <rect x="390" y="352" width="20" height="16" fill="#333"/><text x="368" y="388">South Bridge</text>
  <!-- coalition -->
  <g fill="#2f6fb5"><circle cx="40" cy="240" r="12"/><circle cx="180" cy="240" r="10"/><circle cx="260" cy="120" r="8"/><circle cx="260" cy="360" r="8"/></g>
  <text x="16" y="270">Haven (sanctuary)</text><text x="150" y="268">West Airbase*</text><text x="222" y="104">FOB NW</text><text x="222" y="390">FOB SW</text>
  <!-- contested -->
  <g fill="#ffffff" stroke="#333" stroke-width="2"><circle cx="460" cy="120" r="8"/><circle cx="460" cy="360" r="8"/></g>
  <text x="440" y="146">North Crossing</text><text x="440" y="342">South Crossing</text>
  <!-- static -->
  <g fill="#b53a2f"><circle cx="580" cy="80" r="8"/><circle cx="580" cy="400" r="8"/><circle cx="620" cy="240" r="10"/><rect x="748" y="228" width="24" height="24"/></g>
  <text x="560" y="66">FOB NE</text><text x="560" y="426">FOB SE</text><text x="592" y="268">East Airbase</text><text x="720" y="270">Static HQ</text>
  <!-- legend -->
  <text x="8" y="500">Blue: coalition (3 bases + sanctuary). White: contested (2). Red: Static (3 bases + HQ). * forward_airbase (idle floor).</text>
  <text x="8" y="515">Facilities (not drawn): radar + SAM at each airbase, short-range AD at each FOB, extra radar at the Static HQ. Values TBD by harness.</text>
</svg>
